server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # این proxy فقط داخل docker-compose (سرویس backend) کار می‌کند.
    # اگر فرانت‌اند را جدا روی Vercel/Netlify منتشر می‌کنید،
    # این Dockerfile لازم نیست — فقط پوشه‌ی dist/ را دیپلوی کنید
    # و آدرس بک‌اند را با یک reverse proxy یا متغیر محیطی تنظیم کنید.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
